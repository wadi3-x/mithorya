<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherion Play Zone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Lexend:wght@100..900&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-image: url(img/676e5b71c3ad1a1e1c150e1f77dd04dd.jpg);
    }

    .field {
      width: 100%;
      max-width: 90%;
    }

    .slot {
      aspect-ratio: 59 / 86;
      border: 2px dashed yellow;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      
      color: rgba(255, 255, 255, 0.6);
    }

    .slot1 {
      aspect-ratio: 2 / 3;
      border: 2px dashed yellow;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
   
      color: rgba(255, 255, 255, 0.6);
    }

    #hand .card {
      width: 80px;
    
      border-radius: 6px;
      transition: transform .15s;
    }

    #hand .card:hover {
      transform: translateY(-12px) scale(1.1);
    }

    button:hover {
      background: purple;
    }
  </style>
</head>

<body>
  <header id="header" class="flex flex-wrap items-center justify-center
               gap-3 bg-black/40 p-3 md:flex-wrap md:px-8">

    <nav id="main-nav" class="order-3 w-full md:order-none md:w-auto ">
      <ul class="flex flex-wrap gap-4 text-sm md:gap-6 text-white ">
        <li><a id="nav-home" href="index.html" class="hover:text-[#d6ad60] transition ">Acceuil</a></li>
        <li><a id="nav-shop" href="boutique.html" class="hover:text-[#FFC247]">Boutique</a></li>
        <li><a id="nav-boosters" href="Chamber.html" class="hover:text-[#FFC247]">Boosters</a></li>
        <li><a id="nav-collection" href="Grimoire.html" class="hover:text-[#FFC247]">Collection</a></li>
        <li><a id="nav-deck" href="Deck.html" class="hover:text-[#FFC247]">Deck</a></li>
        <li><a id="nav-play" href="PLAY.html" class="hover:text-[#FFC247]">play</a></li>
      </ul>
    </nav>

  </header>

  <main id="game" class="flex flex-col lg:flex-row gap-4 p-4 w-full max-w-[1500px] mx-auto">

    <aside id="sidebar" class="lg:w-80 bg-black/60 rounded-lg p-4 ">
      <h2 id="collection-title" class="text-purple-400 font-bold mb-3">My Collection</h2>
      <button id="draw-btn" class="w-full bg-black text-white font-bold py-3 rounded-lg mb-3">Draw 5 to Hand</button>
      <p id="deck-count" class="text-purple-300 text-sm">Deck: 0 cards</p>
    </aside>

    <section id="board" class="w-full flex flex-col gap-3 items-center ">

      <div id="opponent-field" class="field  bg-black/50 rounded-xl p-3 border border-red-400/40">
        <div class="grid grid-cols-10 gap-2 mb-2">
          <div id="opp-gy" class="slot" data-zone="gy">empty</div>
          <div id="opp-m1" class="slot" data-zone="m1">empty</div>
          <div id="opp-m2" class="slot" data-zone="m2">empty</div>
          <div id="opp-m3" class="slot" data-zone="m3">empty</div>
          <div id="opp-m4" class="slot" data-zone="m4">empty</div>
          <div id="opp-m5" class="slot" data-zone="m5">empty</div>
          <div id="opp-m5" class="slot" data-zone="m6">empty</div>
          <div id="opp-m5" class="slot" data-zone="m7">empty</div>
          <div id="opp-m5" class="slot" data-zone="m8">empty</div>
          <div id="opp-m5" class="slot" data-zone="m9">empty</div>
        </div>
      </div>

      <button id="end-turn-btn" class="bg-black text-white font-bold px-8 py-3 rounded-lg ">End Turn</button>


      <div id="player-field" class="field bg-black/50 rounded-xl p-3 border border-blue-400/40">
        <div class="grid grid-cols-10 gap-2 mb-2">
          <div id="me-gy" class="slot1" data-zone="gy">Empty</div>
          <div id="me-m1" class="slot1" data-zone="m1">Empty</div>
          <div id="me-m2" class="slot1" data-zone="m2">Empty</div>
          <div id="me-m3" class="slot1" data-zone="m3">Empty</div>
          <div id="me-m4" class="slot1" data-zone="m4">Empty</div>
          <div id="me-m5" class="slot1" data-zone="m5">Empty</div>
          <div id="me-m1" class="slot1" data-zone="m1">Empty</div>
          <div id="me-m2" class="slot1" data-zone="m2">Empty</div>
          <div id="me-m3" class="slot1" data-zone="m3">Empty</div>
          <div id="me-m4" class="slot1" data-zone="m4">Empty</div>
      
        </div>

        <div id="hand-container" class="bg-black/60 rounded-xl p-3 w-full ">
          <p id="hand-title" class="text-yellow-400 text-sm mb-2">Your hand</p>
          <div id="hand" class="flex justify-center gap-2 min-h-[120px]"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="data.js" defer></script>

  <script src="play.js" defer></script>
</body>

</html>
