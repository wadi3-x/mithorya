<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherion Play Zone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Lexend:wght@100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-image: url(img/1a9a5d1dab02cf6c5b86fdce80f77606.jpg); font-family: ;
        }
@font-face {
    font-family: "Mideltank";
    src: url("fonts/MIDELTANK_Demo.otf") format("opentype");
}

.mideltank-font {
    font-family: "Mideltank";
}






        .slot {
            width: 100%;
            max-width: 160px;
            aspect-ratio: 4 / 5;
        }
    </style>
</head>



<main class=" gap-4 p-4 max-w-[1500px] mx-auto ">


    <aside id="deck-play-continer"
        class="lg:w-64 lg:shrink-0 p-4 bg-black/50 rounded-lg flex flex-col gap-3 lg:max-h-[calc(100vh-110px)] lg:sticky lg:top-4">
        <h3 class="text-purple-400 font-bold">My Collection</h3>

        <button id="draw-five-btn"
            class="w-full bg-black hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-lg shadow-md ">
            Draw 5 to Hand
        </button>

        <div id="deck-info" class="text-sm text-purple-400">
            Deck: <span id="deck-count">0</span> cards
        </div>

        <div id="deck-list" class="text-sm text-left overflow-y-auto flex-1 min-h-[120px] max-h-[400px]"></div>
    </aside>

    <div class="grid grid gap-4 min-w-0 ">


        <section class="bg-black/50 rounded-lg p-4 sm:p-6 flex flex-col gap-4  ">

            <div id="random-container" class="grid grid-cols-5 gap-3 sm:gap-6 justify-items-center w-[70%]">
                <div
                    class="slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
              
           

            </div>

            <div class="flex justify-center items-center border-y border-white/10 py-3">
                <button id="end-turn-btn"
                    class="bg-black hover:bg-orange-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition-transform duration-200">
                    End Turn
                </button>
            </div>

            <div id="player-container" class="grid grid-cols-5 gap-3 sm:gap-6 justify-items-center w-[70%]">
                <div
                    class="player-card slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="player-card slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="player-card slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="player-card slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
                <div
                    class="player-card slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm">
                    Empty</div>
            
            </div>
        </section>


        <section class="bg-black/50 rounded-lg p-4">
            <h3 class="text-yellow-400 text-sm mb-3">Your hand</h3>
            <div id="hand-cards" class="grid grid-cols-5 gap-3 sm:gap-6 justify-items-center w-[70%] ">
                <div class="handCard slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm"
                    draggable="true">Empty</div>
                <div class="handCard slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm"
                    draggable="true">Empty</div>
                <div class="handCard slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm"
                    draggable="true">Empty</div>
                <div class="handCard slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm"
                    draggable="true">Empty</div>
                <div class="handCard slot border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center text-white/50 text-sm"
                    draggable="true">Empty</div>
              
             


            </div>
        </section>
    </div>
</main>

</body>

</html>
