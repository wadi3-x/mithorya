
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes boosters - Mythoria</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @keyframes ouvrir { from { transform: scale(1); opacity: 1; } to { transform: scale(.5); opacity: 0; } }
    .animation-booster { animation: ouvrir .5s ease forwards; }
    @keyframes apparaitre { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .carte-animee { animation: apparaitre .4s ease both; }
  </style>
</head>
<body class="min-h-screen bg-[#080611] text-white">
  <header class="flex flex-wrap items-center justify-between gap-3 bg-black p-4 md:px-8">
    <a href="index.html"><img class="w-14 md:w-20" src="img/Emblème Yu-Gi-Oh! aux énergies mystiques.png" alt="Logo Mythoria"></a>
    <nav class="flex flex-wrap gap-4 text-sm md:text-base">
      <a href="index.html" class="hover:text-[#FFC247]">Accueil</a>
      <a href="boutique.html" class="hover:text-[#FFC247]">Boutique</a>
      <a href="Chamber.html" class="text-[#FFC247]">Boosters</a>
      <a href="Grimoire.html" class="hover:text-[#FFC247]">Collection</a>
    </nav>
  </header>
  <main class="mx-auto max-w-6xl px-5 py-12">

    <h1 class="mb-3 text-center text-3xl font-black uppercase text-[#FFC247] md:text-5xl">
        Mes boosters
    
    </h1>

    <p class="mb-10 text-center text-gray-300">
        Clique sur « Ouvrir le booster » pour découvrir tes cartes.

    </p>

    <p id="messageVide" class="rounded-xl border border-purple-900 bg-[#130D23] p-6 text-center text-gray-300">
        Aucun booster. 
        <a href="boutique.html" class="text-[#FFC247] underline">Visiter la boutique</a>
    </p>
    <section id="mesBoosters" class="grid grid-cols-1 gap-6 sm:grid-cols-2 md:grid-cols-4"></section>

    <section id="zoneOuverture" class="mt-12 hidden rounded-2xl border border-purple-800 bg-[#130D23] p-6">

      <h2 id="titreOuverture" class="mb-4 text-center text-2xl font-bold text-[#FFC247]"></h2>

      <img id="imageOuverture" src="" alt="Booster" class="mx-auto h-56 w-full max-w-xs object-contain">




      <p id="messageOuverture" class="my-5 text-center text-gray-300"></p>


      <div id="cartesObtenues" class="grid grid-cols-1 gap-4 sm:grid-cols-3"></div>

      <div class="mt-6 text-center"><button id="fermerOuverture" class="rounded-lg border border-[#FFC247] px-5 py-2 text-[#FFC247] hover:bg-[#FFC247] hover:text-black">Fermer</button></div>


    </section>

    <div class="mt-10 text-center"><a href="boutique.html" class="inline-block rounded-lg bg-[#FFC247] px-5 py-3 font-bold text-black">
        Retour à la boutique</a>
    </div>
 

</main>

  <script src="data.js" defer></script>

</body>

</html>
